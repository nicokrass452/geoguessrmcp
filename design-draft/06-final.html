<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Final – draft</title>
<link rel="stylesheet" href="style.css">
<style>
  .wrap { max-width: 900px; margin: 0 auto; padding: 10px 48px; text-align: center; }
  h1 { font-size: 44px; margin: 10px 0 4px; letter-spacing: -0.03em; }
  .sub { color: var(--muted); font-size: 17px; margin-bottom: 36px; }
  .podium { display: flex; justify-content: center; align-items: flex-end; gap: 18px; margin-bottom: 30px; }
  .col { width: 200px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .col .avatar { width: 64px; height: 64px; font-size: 22px; border: 4px solid var(--bg); }
  .col b { font-size: 17px; }
  .col .pts { color: var(--muted); font-size: 14px; }
  .step { width: 100%; border-radius: 14px 14px 0 0; display: grid; place-items: center; font-size: 34px; font-weight: 800; }
  .list { text-align: left; padding: 8px 20px; margin: 0 auto 28px; max-width: 560px; }
  .li { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .li .avatar { width: 30px; height: 30px; font-size: 11px; }
  .li b { flex: 1; }
  .actions { display: flex; gap: 12px; justify-content: center; }
</style></head>
<body>
  <nav class="nav"><div class="brand"><div class="logo">🌍</div>GeoArena</div></nav>
  <div class="wrap">
    <div style="font-size:48px">🏆</div>
    <h1>You finished 2nd!</h1>
    <div class="sub">Just 610 points behind Gemini. So close.</div>

    <div class="podium">
      <div class="col"><div class="avatar" style="background:var(--you)">CP</div><b>You</b><span class="pts">20,330 pts</span><div class="step" style="height:120px;background:#2a3550">2</div></div>
      <div class="col"><div class="avatar" style="background:var(--gemini)">G</div><b>Gemini</b><span class="pts">20,940 pts</span><div class="step" style="height:170px;background:linear-gradient(#ca8a04,#854d0e)">1</div></div>
      <div class="col"><div class="avatar" style="background:var(--claude)">C</div><b>Claude</b><span class="pts">16,210 pts</span><div class="step" style="height:85px;background:#3b2f25">3</div></div>
    </div>

    <div class="card list">
      <div class="li"><span class="muted">4</span><div class="avatar" style="background:#f472b6">MI</div><b>Mia</b><span class="muted">13,880 pts</span></div>
    </div>

    <div class="actions">
      <span class="btn btn-primary btn-lg">↻ Play again</span>
      <span class="btn btn-lg">Change settings</span>
      <span class="btn btn-lg btn-ghost">Home</span>
    </div>
  </div>
</body></html>
